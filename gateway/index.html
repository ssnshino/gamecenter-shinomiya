<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲームセンターしのみ屋</title>
  <link rel="icon" href="/02/favicon.ico">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#090e18;color:#e8f1ff}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#17314d 0,transparent 60%)}
    main{max-width:920px;margin:auto;padding:clamp(36px,8vw,88px) 24px}p{line-height:1.8;color:#b1c4d9}
    .eyebrow{font-size:12px;letter-spacing:.24em;color:#6cdbdf}h1{font-size:clamp(28px,5vw,44px);margin:20px 0 12px;line-height:1.5}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:40px 0}
    a{display:block;border:1px solid #37516e;border-radius:18px;padding:28px;text-decoration:none;color:inherit;background:#101c2acc;transition:background .18s,transform .18s}
    a:hover{background:#1a2d43;transform:translateY(-3px)}a:focus-visible{outline:3px solid #79f3df;outline-offset:5px}
    .number{color:#79f3df;font:36px monospace}h2{font-size:24px;margin:18px 0 8px}.enter{display:block;margin-top:24px;color:#79f3df}
    footer{font-size:13px;color:#8299b1} @media(max-width:600px){nav{grid-template-columns:1fr;gap:18px;margin:28px 0}a{padding:24px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">GAMECENTER SHINOMIYA</div>
  <h1>ゲームセンターしのみ屋</h1>
  <p>今日は、どちらで遊びますか？</p>
  <nav aria-label="お店を選ぶ">
    <a href="/01/"><span class="number">01</span><h2>1号店</h2><p>Pong、ブロック崩し、ダンジョン、格闘ゲーム。ブラウザーで遊べるレトロゲームのお店。</p><span class="enter">1号店へ →</span></a>
    <a href="/02/"><span class="number">02</span><h2>2号店</h2><p>AirRace3D と Colony Racer。Unityでつくられた3Dゲームのお店。</p><span class="enter">2号店へ →</span></a>
  </nav>
  <footer>お好きなゲームを選んでお楽しみください。</footer>
</main></body></html>
