map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Older compiled clients use the first URL path segment as the app name.
# Their /02/StreamingAssets requests are distinguished by the requesting page.
map $http_referer $unity_legacy_game {
    ~^https?://[^/]+/02/airrace3d/ airrace3d;
    ~^https?://[^/]+/02/colony-racer/ colony-racer;
    default '';
}

server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    location = / { try_files /index.html =404; }
    location = /healthz { return 200 'gamecenter-shinomiya gateway\n'; }
    location = /01 { return 308 /01/$is_args$args; }
    location = /02 { return 308 /02/$is_args$args; }
    location = /02/airrace3d { return 308 /02/airrace3d/$is_args$args; }
    location = /02/colony-racer { return 308 /02/colony-racer/$is_args$args; }
    location /01/ {
        include /etc/nginx/gamecenter-proxy-headers.conf;
        proxy_pass http://classic:3000/;
    }
    location /02/StreamingAssets/ {
        if ($unity_legacy_game = '') { return 404; }
        rewrite ^/02/StreamingAssets/(.*)$ /$unity_legacy_game/StreamingAssets/$1 break;
        include /etc/nginx/gamecenter-proxy-headers.conf;
        proxy_pass http://unity-web:3000;
        # A shared URL must never cache one game's bytes for the other game.
        proxy_hide_header Cache-Control;
        add_header Cache-Control 'private, no-store' always;
        add_header Vary Referer always;
    }
    location /02/ {
        include /etc/nginx/gamecenter-proxy-headers.conf;
        proxy_pass http://unity-web:3000/;
    }
    # Existing compiled Unity clients request these root API namespaces.
    location /api/airrace3d/ {
        include /etc/nginx/gamecenter-proxy-headers.conf;
        proxy_pass http://unity-web:3000;
    }
    location /api/colony-racer/ {
        include /etc/nginx/gamecenter-proxy-headers.conf;
        proxy_pass http://unity-web:3000;
    }
    location = /airrace3d { return 308 /02/airrace3d/$is_args$args; }
    location /airrace3d/ { return 308 /02$request_uri; }
    location = /colony-racer { return 308 /02/colony-racer/$is_args$args; }
    location /colony-racer/ { return 308 /02$request_uri; }
    location = /favicon.ico { proxy_pass http://unity-web:3000/favicon.ico; }
    location / { return 404; }
}

server {
    listen 80;
    server_name rust-sandbox.wos.ktsys.jp;
    # Preserve sockets/API for pages already open when the migration happens.
    location ~ ^/(ws(?:2p|/.*)?|api/.*)$ {
        include /etc/nginx/gamecenter-proxy-headers.conf;
        proxy_pass http://classic:3000;
    }
    location / { return 308 https://unity-games.wos.ktsys.jp/01$request_uri; }
}
