name: Inspect guarded Colony deployment state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only recorded container differences
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_DEV_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_DEV_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          chmod 700 "$work"
          printf '%s\n' "$DEPLOY_KEY" > "$work/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"
          unset DEPLOY_KEY
          ssh -i "$work/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "shino@$DEPLOY_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/shino/source/repos/upstream/gamecenter-shinomiya
          receipt=runtime/deploy/unity-colony-c6ad33dbb2507cd22c36c207b70f6679bbb368d3-20261016T055417Z
          python3 - "$receipt" <<'PY'
          import json,sys,pathlib,subprocess
          p=pathlib.Path(sys.argv[1]);base=json.loads((p/'before.json').read_text());print('RECEIPT', (p/'receipt.json').read_text());print('CHECKOUT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip());print('STATUS',subprocess.check_output(['git','status','--porcelain','--untracked-files=normal'],text=True));print('RELEASE_TAGS',pathlib.Path('.env.release').read_text())
          for name in ['provisional.json','final-preflight.json','recovery-start.json']:
           q=p/name
           if not q.exists():continue
           after=json.loads(q.read_text());a={x['name']:x for x in base['containers']};b={x['name']:x for x in after['containers']};rows=[]
           for n in sorted(a.keys()|b.keys()):
            if n=='/gamecenter-shinomiya-unity-web':continue
            for k in sorted(set(a.get(n,{}))|set(b.get(n,{}))):
             if a.get(n,{}).get(k)!=b.get(n,{}).get(k):rows.append({'container':n,'field':k,'before':a.get(n,{}).get(k),'after':b.get(n,{}).get(k)})
           print(name,json.dumps(rows));print('PRESERVED',json.dumps({'runtimeUnchanged':base['runtime']==after['runtime'],'metadataUnchanged':base['metadataHashes']==after['metadataHashes'],'releaseValues':after['releaseValues'],'unity':[x for x in after['containers'] if x['name']=='/gamecenter-shinomiya-unity-web']}))
          PY
          REMOTE
