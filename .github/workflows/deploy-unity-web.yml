name: Prefetch Colony release over home LAN
on:
  workflow_dispatch:
    inputs:
      bundle_sha256:
        required: true
        type: string
      release_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import verified release objects without changing the live checkout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_DEV_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_DEV_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
          BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ $BUNDLE_SHA =~ ^[a-f0-9]{64}$ && $RELEASE_REF == refs/heads/release/forest-mobile-20261016 ]]
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          chmod 700 "$work"
          printf '%s\n' "$DEPLOY_KEY" > "$work/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"
          unset DEPLOY_KEY
          ssh -i "$work/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "shino@$DEPLOY_HOST" "bash -s -- '$BUNDLE_SHA' '$RELEASE_REF'" <<'REMOTE'
          set -euo pipefail
          cd /home/shino/source/repos/upstream/gamecenter-shinomiya
          [[ $(git branch --show-current) == dev && -z $(git status --porcelain --untracked-files=normal) ]]
          before=$(git rev-parse HEAD)
          bundle=$(mktemp /tmp/colony-release.XXXXXX.bundle)
          trap 'rm -f "$bundle"' EXIT
          curl --fail --show-error --connect-timeout 5 --max-time 180 -o "$bundle" http://192.168.1.34:18777/colony-forest-20261016-8f2ac29b/release.bundle
          printf '%s  %s\n' "$1" "$bundle" | sha256sum -c -
          git bundle verify "$bundle"
          git fetch "$bundle" "$2:refs/remotes/colony-lan/forest-mobile-20261016"
          [[ $(git rev-parse HEAD) == "$before" && -z $(git status --porcelain --untracked-files=normal) ]]
          echo 'Release objects imported; live checkout and services unchanged.'
          REMOTE

